<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚓 超勤勉煩惱 (大小月精算版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script>
        // 設定 Tailwind 深色模式
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            transition: background-color 0.3s ease;
        }
        .dark body { background-color: #0f172a; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:text-slate-100 antialiased selection:bg-blue-200">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;

        const monthData = [
            { name: '一月', days: 21, totalDays: 31 }, { name: '二月', days: 14, totalDays: 28 },
            { name: '三月', days: 22, totalDays: 31 }, { name: '四月', days: 20, totalDays: 30 },
            { name: '五月', days: 20, totalDays: 31 }, { name: '六月', days: 21, totalDays: 30 },
            { name: '七月', days: 23, totalDays: 31 }, { name: '八月', days: 21, totalDays: 31 },
            { name: '九月', days: 20, totalDays: 30 }, { name: '十月', days: 20, totalDays: 31 },
            { name: '十一月', days: 21, totalDays: 30 }, { name: '十二月', days: 22, totalDays: 31 },
        ];

        const getSavedString = (key, defaultVal) => {
            try { return localStorage.getItem(key) ?? defaultVal; } 
            catch (e) { return defaultVal; }
        };
        
        const getSavedInput = (key, defaultVal) => {
            try {
                const saved = localStorage.getItem(key);
                return (saved === null || saved === '0') ? defaultVal : saved;
            } catch (e) { return defaultVal; }
        };

        const sanitizeHTML = (str) => {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag]));
        };

        function App() {
            // 深色模式狀態
            const [isDark, setIsDark] = useState(() => localStorage.getItem('ot_theme') === 'dark');
            
            // 計算狀態
            const [month, setMonth] = useState(() => getSavedString('ot_month', '三月'));
            const [offDays, setOffDays] = useState(() => getSavedInput('ot_offDays', '10'));
            const [restDays, setRestDays] = useState(() => getSavedInput('ot_restDays', ''));
            const [sleepOutDays, setSleepOutDays] = useState(() => getSavedInput('ot_sleepOutDays', ''));
            const [longRestHours, setLongRestHours] = useState(() => getSavedInput('ot_longRestHours', ''));
            const [compDays, setCompDays] = useState(() => getSavedInput('ot_compDays', ''));
            const [leaveDays, setLeaveDays] = useState(() => getSavedInput('ot_leaveDays', ''));
            const [hourlyRate, setHourlyRate] = useState(() => getSavedInput('ot_hourlyRate', '177'));
            const [maxOvertimePay, setMaxOvertimePay] = useState(() => getSavedInput('ot_maxOvertimePay', '19000'));

            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [aiAdvice, setAiAdvice] = useState('');

            // Firebase 狀態
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);
            const [fbDeps, setFbDeps] = useState(null);
            const [messages, setMessages] = useState([]);
            const [userName, setUserName] = useState(() => getSavedString('ot_userName', '匿名同仁'));
            const [newMessage, setNewMessage] = useState('');
            const [isFirebaseEnabled, setIsFirebaseEnabled] = useState(false);
            const messagesEndRef = useRef(null);

            // 處理深色模式切換
            useEffect(() => {
                const root = window.document.documentElement;
                if (isDark) {
                    root.classList.add('dark');
                    localStorage.setItem('ot_theme', 'dark');
                } else {
                    root.classList.remove('dark');
                    localStorage.setItem('ot_theme', 'light');
                }
            }, [isDark]);

            // 自動儲存
            useEffect(() => {
                const data = { ot_month: month, ot_offDays: offDays, ot_restDays: restDays, ot_sleepOutDays: sleepOutDays, ot_longRestHours: longRestHours, ot_compDays: compDays, ot_leaveDays: leaveDays, ot_hourlyRate: hourlyRate, ot_maxOvertimePay: maxOvertimePay, ot_userName: sanitizeHTML(userName) };
                Object.entries(data).forEach(([k, v]) => localStorage.setItem(k, v));
            }, [month, offDays, restDays, sleepOutDays, longRestHours, compDays, leaveDays, hourlyRate, maxOvertimePay, userName]);

            // Firebase 初始化
            useEffect(() => {
                let isMounted = true;
                const initFirebase = async () => {
                    try {
                        const firebaseConfig = {
                            apiKey: "AIzaSyBPRWl_sHEZAsmRT7BMF8AZqOQVc6B94JY",
                            authDomain: "overtime-pay-5fae4.firebaseapp.com",
                            projectId: "overtime-pay-5fae4",
                            storageBucket: "overtime-pay-5fae4.firebasestorage.app",
                            messagingSenderId: "1003542286992",
                            appId: "1:1003542286992:web:a447d243017eb578193e15",
                            measurementId: "G-TZLR3HX3PJ"
                        };

                        const [appModule, authModule, firestoreModule] = await Promise.all([
                            import('https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js'),
                            import('https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js'),
                            import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js')
                        ]);

                        const app = appModule.initializeApp(firebaseConfig);
                        const auth = authModule.getAuth(app);
                        const store = firestoreModule.getFirestore(app);

                        if (!isMounted) return;
                        setDb(store);
                        setFbDeps({ ...firestoreModule });
                        setIsFirebaseEnabled(true);

                        await authModule.signInAnonymously(auth);
                        authModule.onAuthStateChanged(auth, u => { if (isMounted) setUser(u); });
                    } catch (e) { console.error("Firebase Error:", e); }
                };
                initFirebase();
                return () => { isMounted = false; };
            }, []);

            // 讀取留言
            useEffect(() => {
                if (!user || !db || !fbDeps) return;
                const q = fbDeps.query(fbDeps.collection(db, 'messages'), fbDeps.orderBy("createdAt", "asc"), fbDeps.limit(50));
                return fbDeps.onSnapshot(q, s => {
                    setMessages(s.docs.map(d => ({ id: d.id, ...d.data() })));
                });
            }, [user, db, fbDeps]);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

            // 發送留言 (含冷卻限制)
            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!user || !db || !fbDeps || !newMessage.trim()) return;

                const lastTime = localStorage.getItem('ot_last_msg_time');
                const now = Date.now();
                if (lastTime && (now - lastTime < 30000)) {
                    alert(`學長休息一下！請等待 ${Math.ceil((30000 - (now - lastTime)) / 1000)} 秒再發言。`);
                    return;
                }

                const msg = newMessage.trim();
                setNewMessage('');
                try {
                    await fbDeps.addDoc(fbDeps.collection(db, 'messages'), {
                        text: sanitizeHTML(msg).substring(0, 200),
                        author: sanitizeHTML(userName).substring(0, 10),
                        userId: user.uid,
                        createdAt: fbDeps.serverTimestamp()
                    });
                    localStorage.setItem('ot_last_msg_time', Date.now());
                } catch (err) { setNewMessage(msg); }
            };

            // 運算邏輯
            const safeNum = v => Number(v) || 0;
            const curMonth = monthData.find(m => m.name === month);
            const totalDays = curMonth?.totalDays || 30;
            const blackDays = curMonth?.days || 0;
            const isLarge = totalDays === 31;
            const basicOff = isLarge ? 18 : 17;

            const workDays = Math.max(0, totalDays - safeNum(offDays) - safeNum(restDays) - safeNum(sleepOutDays));
            const totalWorkHrs = (workDays * 22) + (safeNum(restDays) * 14) + (safeNum(sleepOutDays) * 10);
            const deductHrs = (safeNum(compDays) * 12) + (safeNum(leaveDays) * 8);
            const requiredHrs = (blackDays * 8) - deductHrs;
            const otHrs = Math.max(0, totalWorkHrs - requiredHrs - safeNum(longRestHours));

            const actualOffHrs = (safeNum(offDays) * 24) + (safeNum(restDays) * 10) + (safeNum(sleepOutDays) * 14) + safeNum(longRestHours);
            const maxPayHrs = Math.ceil(safeNum(maxOvertimePay) / safeNum(hourlyRate));
            const estPay = Math.min(otHrs * safeNum(hourlyRate), safeNum(maxOvertimePay));

            const analyzeSchedule = () => {
                setIsAnalyzing(true);
                setTimeout(() => {
                    let adv = `💰 【${otHrs >= maxPayHrs ? '超勤溢出' : '超勤未滿'}】\n`;
                    adv += otHrs >= maxPayHrs ? `已達上限！多出 ${otHrs - maxPayHrs} 小時無法領錢，建議多排休。` : `距離上限還差 ${maxPayHrs - otHrs} 小時，可考慮調整班表。`;
                    adv += `\n\n🏖️ 【休假檢核】\n本月為${isLarge ? '大' : '小'}月，本休 ${basicOff} 天。您目前共休 ${Math.floor(actualOffHrs/24)}天${actualOffHrs%24}時。`;
                    setAiAdvice(adv);
                    setIsAnalyzing(false);
                }, 600);
            };

            return (
                <div className="min-h-screen pb-16 dark:bg-slate-900 transition-colors duration-300">
                    <header className="bg-slate-900 dark:bg-black text-white pt-8 pb-16 px-4 text-center rounded-b-[3rem] shadow-lg relative">
                        <button onClick={() => setIsDark(!isDark)} className="absolute top-4 right-4 bg-white/10 p-2 rounded-full backdrop-blur-md border border-white/10 hover:bg-white/20 transition-all">
                            {isDark ? '☀️ 淺色' : '🌙 深色'}
                        </button>
                        <div className="max-w-5xl mx-auto">
                            <h1 className="text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-200 via-white to-blue-200">超勤勉煩惱</h1>
                            <p className="mt-3 text-blue-200 font-medium bg-blue-900/50 px-5 py-1.5 rounded-full text-sm inline-block">115年度精算版 ✨</p>
                        </div>
                    </header>

                    <main className="max-w-6xl mx-auto px-4 -mt-10 relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <div className="lg:col-span-7 space-y-6">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-100 dark:border-slate-700">
                                <h2 className="text-xl font-bold mb-6 flex items-center dark:text-white"><span className="bg-amber-100 dark:bg-amber-900/30 text-amber-600 p-2 rounded-lg mr-3 text-sm">✏️</span> 排班設定</h2>
                                <div className="space-y-6">
                                    <select className="w-full sm:w-1/2 bg-amber-50 dark:bg-slate-700 border-2 border-amber-200 dark:border-slate-600 rounded-xl p-3 font-bold dark:text-white" value={month} onChange={e => setMonth(e.target.value)}>
                                        {monthData.map(m => <option key={m.name} value={m.name}>{m.name}</option>)}
                                    </select>
                                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                        <InputCard label="全日休假" value={offDays} onChange={setOffDays} dark={isDark} />
                                        <InputCard label="日休(14h)" value={restDays} onChange={setRestDays} dark={isDark} />
                                        <InputCard label="外宿(10h)" value={sleepOutDays} onChange={setSleepOutDays} dark={isDark} />
                                        <InputCard label="長休時數" value={longRestHours} onChange={setLongRestHours} suffix="hr" dark={isDark} />
                                        <InputCard label="補休天數" value={compDays} onChange={setCompDays} suffix="天" dark={isDark} />
                                        <InputCard label="請假天數" value={leaveDays} onChange={setLeaveDays} suffix="天" dark={isDark} />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="lg:col-span-5 space-y-6">
                            <div className={`rounded-2xl shadow-xl p-6 text-white ${estPay >= safeNum(maxOvertimePay) ? 'bg-gradient-to-br from-emerald-500 to-teal-700' : 'bg-gradient-to-br from-blue-600 to-indigo-800'}`}>
                                <h2 className="text-white/80 font-bold text-sm tracking-widest mb-2">預估超勤金額</h2>
                                <div className="flex items-baseline space-x-2">
                                    <span className="text-3xl font-bold">$</span>
                                    <span className="text-5xl font-black">{estPay.toLocaleString()}</span>
                                </div>
                            </div>

                            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-xl p-6 border dark:border-slate-700">
                                <h3 className="font-bold mb-3 flex items-center dark:text-indigo-300"><span className="text-xl mr-2">✨</span> Uncle</h3>
                                {!aiAdvice && !isAnalyzing ? (
                                    <button onClick={analyzeSchedule} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition-colors">✨ 補啥小</button>
                                ) : isAnalyzing ? (
                                    <div className="py-6 text-center text-indigo-600 animate-pulse">精算中...</div>
                                ) : (
                                    <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl text-sm leading-relaxed dark:text-slate-300">
                                        {aiAdvice.split('\n').map((l, i) => <p key={i}>{l}</p>)}
                                        <button onClick={analyzeSchedule} className="mt-4 text-xs font-bold text-indigo-500">🔄 重新精算</button>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="lg:col-span-12">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-xl border dark:border-slate-700 overflow-hidden flex flex-col h-[450px]">
                                <div className="bg-slate-800 dark:bg-black p-4 flex justify-between items-center">
                                    <h3 className="font-bold text-white flex items-center">💬 警消茶水間</h3>
                                    <input type="text" className="bg-slate-700 text-white text-sm rounded px-3 py-1 w-32 focus:ring-2 focus:ring-blue-400 outline-none" value={userName} onChange={e => setUserName(e.target.value)} maxLength={10} placeholder="暱稱" />
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 hide-scrollbar dark:bg-slate-900/50">
                                    {messages.map(m => {
                                        const isMe = user && m.userId === user.uid;
                                        return (
                                            <div key={m.id} className={`flex flex-col ${isMe ? 'items-end' : 'items-start'}`}>
                                                <span className="text-[10px] text-slate-400 mb-1">{m.author}</span>
                                                <div className={`px-4 py-2 rounded-2xl max-w-[80%] text-sm shadow-sm ${isMe ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-700 dark:text-white'}`}>{m.text}</div>
                                            </div>
                                        );
                                    })}
                                    <div ref={messagesEndRef} />
                                </div>
                                <form onSubmit={handleSendMessage} className="p-4 border-t dark:border-slate-700 bg-white dark:bg-slate-800 flex space-x-2">
                                    <input type="text" className="flex-1 bg-slate-100 dark:bg-slate-700 dark:text-white rounded-xl px-4 py-2 focus:ring-2 focus:ring-blue-400 outline-none" value={newMessage} onChange={e => setNewMessage(e.target.value)} maxLength={200} placeholder="講點什麼..." />
                                    <button type="submit" disabled={!newMessage.trim()} className="bg-blue-600 text-white px-5 py-2 rounded-xl font-bold disabled:opacity-50">發送</button>
                                </form>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        function InputCard({ label, value, onChange, suffix = "", dark }) {
            return (
                <div className="space-y-1">
                    <label className="text-xs font-bold text-slate-500 dark:text-slate-400">{label}</label>
                    <div className="relative">
                        <input type="number" className="w-full bg-amber-50 dark:bg-slate-700 border border-amber-200 dark:border-slate-600 rounded-lg p-2.5 font-bold text-center dark:text-white focus:ring-2 focus:ring-amber-300 outline-none" value={value} onChange={e => onChange(e.target.value)} />
                        {suffix && <span className="absolute right-2 top-2.5 text-[10px] text-slate-400">{suffix}</span>}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
